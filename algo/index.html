<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Algorithm Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Algorithm Visualizer</h1>
    <p id="meta" class="meta">加载中…</p>
  </header>

  <main>
    <!-- Two linked dropdowns: choosing a type rebuilds the algorithm list,
         so only algorithms that belong to the chosen type are shown. -->
    <div class="selectors">
      <label>类型
        <select id="typeSel"></select>
      </label>
      <label>算法
        <select id="algoSel"></select>
      </label>
    </div>

    <canvas id="board" width="960" height="380"></canvas>

    <div class="controls">
      <button id="prev">上一帧</button>
      <button id="play" class="primary">播放</button>
      <button id="next">下一帧</button>
      <button id="reset">重置</button>
      <label class="speed">
        速度
        <input id="speed" type="range" min="20" max="600" step="10" value="220" />
      </label>
    </div>

    <p id="status" class="status"></p>
    <p class="legend" id="legend">
      <span class="dot compare"></span> 比较中
      <span class="dot swap"></span> 交换
      <span class="dot write"></span> 写入
      <span class="dot excluded"></span> 已排除
      <span class="dot found"></span> 已排序 / 找到
    </p>
    <p id="complexity" class="complexity"></p>
  </main>

  <!-- data.js is generated by the C++ program. It must be loaded BEFORE app.js. -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
